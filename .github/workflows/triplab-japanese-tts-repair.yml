name: triplab-japanese-tts-repair

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/triplab-japanese-tts-repair.yml

jobs:
  synthesize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TTS dependency
        run: python -m pip install --disable-pip-version-check gTTS==2.5.4
      - name: Generate concise intelligible Japanese narration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/raw
          cat > /tmp/generate.py <<'PY'
          from gtts import gTTS
          from pathlib import Path

          segments = [
              "乗り継ぎに遅れた。航空券は買い直し？",
              "答えは、同じ予約かどうかで変わります。",
              "同じ予約なら、次の空席便へ振り替えられるのが一般的。",
              "空港では、乗り継ぎカウンターへ。",
              "別々に買った航空券は、買い直しになることがあります。",
              "確認するのは、同じ予約の通し発券かどうかです。",
          ]
          out = Path("output/raw")
          for i, text in enumerate(segments, 1):
              gTTS(text=text, lang="ja", slow=False).save(str(out / f"segment_{i:02d}.mp3"))
          Path("output/script.txt").write_text("\n".join(segments), encoding="utf-8")
          PY
          python /tmp/generate.py
          python - <<'PY'
          from pathlib import Path
          files = sorted(Path("output/raw").glob("segment_*.mp3"))
          assert len(files) == 6, files
          assert all(p.stat().st_size > 1000 for p in files)
          print("generated", len(files), "Japanese narration segments")
          PY
      - name: Upload narration artifact
        uses: actions/upload-artifact@v4
        with:
          name: triplab-japanese-narration-review-v2
          path: output/
          if-no-files-found: error
          retention-days: 7
