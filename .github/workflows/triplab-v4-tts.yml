name: triplab-v4-tts

on:
  push:
    paths:
      - .github/workflows/triplab-v4-tts.yml

jobs:
  synthesize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check edge-tts
      - name: Generate Japanese narration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/raw
          cat > /tmp/generate.py <<'PY'
          import asyncio
          import json
          from pathlib import Path
          import edge_tts

          segments = [
              "乗り継ぎに遅れた。航空券は買い直し？",
              "答えは、同じ予約かどうかで変わります。",
              "同じ予約なら、次の空席便へ振り替えられるのが一般的。",
              "空港では、乗り継ぎカウンターへ。",
              "別々に買った航空券は、買い直しになることがあります。",
              "確認するのは、同じ予約の通し発券かどうか。詳しいケースは、関連動画で解説しています。",
          ]

          async def main() -> None:
              voices = await edge_tts.list_voices()
              candidates = [v for v in voices if v.get("Locale") == "ja-JP" and v.get("Gender") == "Male"]
              voice = next((v["ShortName"] for v in candidates if "Keita" in v.get("ShortName", "")), candidates[0]["ShortName"])
              for index, text in enumerate(segments, 1):
                  await edge_tts.Communicate(text=text, voice=voice, rate="+5%", pitch="-2Hz").save(f"output/raw/segment_{index:02d}.mp3")
              Path("output/script.txt").write_text("\n".join(segments), encoding="utf-8")
              Path("output/voice.json").write_text(json.dumps({"engine": "edge_tts", "voice": voice, "rate": "+5%", "pitch": "-2Hz", "revision": 4}, ensure_ascii=False, indent=2), encoding="utf-8")

          asyncio.run(main())
          PY
          python /tmp/generate.py
      - uses: actions/upload-artifact@v4
        with:
          name: triplab-v4-narration
          path: output/
          retention-days: 7
